ckground:#fff0bf;color:#825d00}.finished{background:#e4e8ee;color:#4d5662}.cancelled{background:#ffe0df;color:#a12520}.money{background:var(--ink);color:#fff}.money .box-head{border-color:var(--line)}.money-list{padding:14px 20px}.money-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.money-row:last-child{border:0}.money-row span{color:#b8bec7;font-size:.86rem}.money-row strong{color:var(--yellow)}.alert{margin:0 20px 20px;padding:14px;border:1px solid rgba(255,190,44,.4);background:rgba(255,190,44,.1);border-radius:8px;font-size:.82rem;line-height:1.45}.view{display:none}.view.active{display:block}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.search{flex:1;min-width:220px;border:1px solid #d5d9de;background:#fff;padding:12px 14px;border-radius:8px}.filter{border:1px solid #d5d9de;background:#fff;padding:12px;border-radius:8px}.table-wrap{background:#fff;border:1px solid #dfe2e5;border-radius:12px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:15px 17px;text-align:left;border-bottom:1px solid #eceef0}th{font-size:.72rem;text-transform:uppercase;color:#717a85;background:#f7f8f9}td{font-size:.9rem}tr:last-child td{border:0}.link-btn{border:0;background:none;color:#007d56;font-weight:900;cursor:pointer;padding:10px 2px;min-height:44px;font-size:.95rem}
    .match-list{background:#fff;border:1px solid #dfe2e5;border-radius:12px;overflow:hidden}.mcard{padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;border-bottom:1px solid #eceef0}.mcard:last-child{border:0}.mcard .time{min-width:64px}.mcard .who{flex:1;min-width:180px}.mcard .who b{display:block;font-size:1.02rem}.mcard .money-mini{text-align:right;min-width:110px}.mcard .money-mini b{display:block;font:900 1.15rem var(--display)}.mcard .money-mini small{color:#8b929b}.entity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.entity{background:#fff;border:1px solid #dfe2e5;border-radius:12px;padding:20px}.entity-top{display:flex;justify-content:space-between;gap:12px}.entity h3{margin:0 0 5px}.entity p{color:#737b86;font-size:.84rem}.entity-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}.entity-stats div{background:#f2f4f5;border-radius:8px;padding:10px}.entity-stats small{display:block;color:#737b86}.entity-stats strong{font:900 1.3rem var(--display)}.tournament{grid-column:span 1}.progress{height:7px;border-radius:10px;background:#e1e4e7;overflow:hidden;margin-top:15px}.progress i{display:block;height:100%;background:var(--brand)}.empty{padding:35px;text-align:center;color:#737b86}.subhead{margin:30px 2px 12px;font:900 1.3rem var(--display);text-transform:uppercase;color:#3b434c}.mobile-nav{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:none;place-items:center;padding:18px}.modal.open{display:grid}.dialog{width:min(760px,100%);max-height:92svh;overflow:auto;background:#fff;border-radius:14px}.dialog-head{padding:20px 22px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0;font:900 2rem/1 var(--display);text-transform:uppercase}.close{border:0;background:none;color:#fff;font-size:1.8rem;cursor:pointer}.form{padding:22px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:.85rem;font-weight:900;text-transform:uppercase;color:#606a75}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd1d7;border-radius:9px;padding:14px;min-height:50px;font-size:1.05rem;background:#fff}.section-h{grid-column:1/-1;margin:6px 0 -4px;font:900 .95rem/1 var(--body);text-transform:uppercase;color:#8b929b;letter-spacing:.04em}

    .money-basic{display:grid;grid-template-columns:1fr 1fr;gap:14px}.money-result{margin-top:14px;background:var(--ink);color:#fff;border-radius:8px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.money-result small{color:#aeb4bf;text-transform:uppercase;font-weight:800;font-size:.72rem}.money-result strong{font:900 1.6rem var(--display);color:var(--brand)}
    .adv-toggle{margin-top:14px;border:0;background:none;color:#007d56;font-weight:900;padding:10px 2px;min-height:44px;cursor:pointer;text-decoration:underline}.adv-panel{margin-top:6px}.adv-panel[hidden]{display:none}

    @media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.entity-grid{grid-template-columns:repeat(2,1fr)}}

<body>
<div class="app">
  <aside class="side"><img class="side-logo" src="assets/logos/logo-completo.png" alt="Silbatazo"><nav class="nav" id="desktopNav"></nav><div class="side-foot"><div class="user"><span class="avatar" id="userAvatar">A</span><div><b id="userName">Administrador</b><small>Equipo Silbatazo</small></div></div><a class="public" href="silbatazo_landing_disruptiva.html">← Volver a la web pública</a><button class="logout" id="logoutBtn" type="button">Cerrar sesión</button></div></aside>
  <main class="main"><header class="topbar"><div><h1 id="pageTitle">Inicio</h1><span class="today" id="today"></span></div><div class="topbar-actions"><button class="new" id="newMatch">+ Nuevo partido</button></div></header><div class="content" id="content"></div></main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h2>Nuevo partido</h2><button class="close" id="closeModalBtn" type="button" aria-label="Cerrar">×</button></div><form class="form" id="matchForm"><div class="form-grid">
  <div class="section-h">¿Cuándo y dónde?</div>
  <div class="field"><label for="date">Fecha</label><input id="date" name="date" type="date" required></div><div class="field"><label for="time">Hora</label><input id="time" name="time" type="time" required></div>
  <div class="field full"><label for="place">Cancha</label><input id="place" name="place" list="courtsList" placeholder="Cancha y municipio" required><datalist id="courtsList"></datalist></div>
  <div class="section-h">¿Quién juega?</div>
  <div class="field"><label for="client">Cliente</label><select id="client" name="client"></select></div><div class="field"><label for="type">Tipo</label><select id="type" name="type"><option>Amistoso</option><option>Torneo</option><option>Promocional</option><option>Normal</option><option>Otro</option></select></div><div class="field full"><label for="tournament">Torneo / jornada</label><select id="tournament" name="tournament"><option value="">Partido independiente</option></select></div>
  <div class="field full" id="categoryField" hidden><label for="category">Categoría (carga la tarifa)</label><select id="category"></select></div>
  <div class="field" id="localTeamField" hidden><label for="localTeam">Equipo local</label><select id="localTeam"></select></div><div class="field" id="visitorTeamField" hidden><label for="visitorTeam">Equipo visitante</label><select id="visitorTeam"></select></div>
  <div class="field full"><label for="name">Partido / equipos</label><input id="name" name="name" placeholder="Ej. Los del Barrio vs Amigos FC" required></div>
  <div class="section-h">Árbitro</div>
  <div class="field"><label for="referee">Árbitro central</label><select id="referee" name="referee"></select></div><div class="field"><label for="status">Estado</label><select id="status" name="status"><option value="pending">Pendiente de árbitro</option><option value="confirmed">Confirmado</option><option value="finished">Finalizado</option><option value="cancelled">Cancelado</option></select></div>
  <div class="field full" style="display:flex;align-items:center;gap:10px;flex-direction:row"><input id="soloArbitraje" type="checkbox" style="width:22px;height:22px;min-height:0"><label style="text-transform:none;font-weight:700">Solo arbitraje (sin veedor, sin tarjetas, sin pago a torneo)</label></div>
  <div class="field full" id="arbiterIsObserverField" hidden style="display:flex;align-items:center;gap:10px;flex-direction:row"><input id="arbiterIsObserver" type="checkbox" style="width:22px;height:22px;min-height:0"><label style="text-transform:none;font-weight:700">El árbitro también hace de veedor</label></div>
  <div class="section-h">Veedor</div>
  <div class="field"><label for="observer">Veedor asignado</label><select id="observer" name="observer"></select></div><div class="field"><label for="observerFee">Pago al veedor</label><input id="observerFee" name="observerFee" type="number" min="0" step="1000" value="0"></div>
  <div class="financial"><h3>Dinero</h3><div class="money-basic"><div class="field"><label for="service">Cobras al cliente</label><input id="service" name="service" type="number" min="0" step="1000" value="80000"></div><div class="field"><label for="refPay">Le pagas al árbitro</label><input id="refPay" name="refPay" type="number" min="0" step="1000" value="70000"></div></div><div class="money-result"><small>Tu utilidad</small><strong id="profitCalc">$10.000</strong></div>
    <button type="button" class="adv-toggle" id="advToggle">Ajustar quién le paga a quién ↓</button>
    <div class="adv-panel" id="advPanel" hidden><div class="form-grid"><div class="field"><label for="toSilbatazo">Cliente → Silbatazo</label><input id="toSilbatazo" name="toSilbatazo" type="number" min="0" step="1000" value="40000"></div><div class="field"><label for="toRef">Cliente → árbitros</label><input id="toRef" name="toRef" type="number" min="0" step="1000" value="40000"></div><div class="field"><label for="paidRef">Silbatazo → árbitros</label><input id="paidRef" name="paidRef" type="number" min="0" step="1000" value="0"></div></div><div class="calc"><div><small>Debemos al árbitro</small><strong id="debtCalc">$30.000</strong></div><div><small>Cliente debe</small><strong id="clientDebtCalc">$0</strong></div></div></div>
  </div>
  <div class="field full"><label for="notes">Observaciones</label><textarea id="notes" name="notes" rows="2"></textarea></div>
  </div><div class="actions"><button type="button" class="ghost" id="cancelModal">Cancelar</button><button class="save" type="submit">Guardar partido</button></div></form></div></div>

<div class="modal" id="clientModal"><div class="dialog"><div class="dialog-head"><h2>Nuevo cliente</h2><button class="close" id="closeClientModal" type="button">×</button></div><form class="form" id="clientForm"><div class="form-grid">
  <div class="field full"><label for="clientName">Nombre</label><input id="clientName" name="name" required></div>
  <div class="field"><label for="clientPhone">Teléfono</label><input id="clientPhone" name="phone"></div>
  <div class="field"><label for="clientType">Tipo</label><select id="clientType" name="type"><option value="person">Persona</option><option value="company">Empresa</option><option value="tournament">Torneo</option></select></div>
</div><div class="actions"><button type="button" class="ghost" id="cancelClientModal">Cancelar</button><button class="save" type="submit">Guardar</button></div></form></div></div>

<div class="modal" id="refereeModal"><div class="dialog"><div class="dialog-head"><h2>Nuevo árbitro</h2><button class="close" id="closeRefereeModal" type="button">×</button></div><form class="form" id="refereeForm"><div class="form-grid">
  <div class="field full"><label for="refereeName">Nombre</label><input id="refereeName" name="name" required></div>
  <div class="field"><label for="refereePhone">Teléfono</label><input id="refereePhone" name="phone"></div>
  <div class="field"><label for="refereeAvailable">Disponibilidad</label><input id="refereeAvailable" name="availability" placeholder="Ej. Fines de semana"></div>
  <div class="field full" style="display:flex;align-items:center;gap:10px;flex-direction:row"><input id="refereePromo" name="promo" type="checkbox" style="width:22px;height:22px;min-height:0"><label for="refereePromo" style="text-transform:none;font-weight:700">Acepta promociones / partidos con descuento</label></div>
</div><div class="actions"><button type="button" class="ghost" id="cancelRefereeModal">Cancelar</button><button class="save" type="submit">Guardar</button></div></form></div></div>

<div class="modal" id="tournamentModal"><div class="dialog"><div class="dialog-head"><h2>Nuevo torneo</h2><button class="close" id="closeTournamentModal" type="button">×</button></div><form class="form" id="tournamentForm"><div class="form-grid">
  <div class="field full"><label for="tournamentName">Nombre</label><input id="tournamentName" name="name" required></div>
  <div class="field full"><label for="tournamentNotes">Notas</label><textarea id="tournamentNotes" name="notes" rows="2"></textarea></div>
</div><div class="actions"><button type="button" class="ghost" id="cancelTournamentModal">Cancelar</button><button class="save" type="submit">Guardar</button></div></form></div></div>

<div class="modal" id="veedorModal"><div class="dialog"><div class="dialog-head"><h2>Nuevo veedor</h2><button class="close" id="closeVeedorModal" type="button">×</button></div>
<form class="form" id="veedorForm"><div class="form-grid">
  <div class="field full"><label for="veedorName">Nombre</label><input id="veedorName" name="name" required></div>
  <div class="field"><label for="veedorPhone">Teléfono</label><input id="veedorPhone" name="phone"></div>
  <div class="field"><label for="veedorEmail">Correo (para el login)</label><input id="veedorEmail" name="email" type="email" required></div>
</div><div class="actions"><button type="button" class="ghost" id="cancelVeedorModal">Cancelar</button><button class="save" type="submit">Guardar</button></div></form>
<div class="form" id="veedorResult" hidden></div>
</div></div>

<div class="modal" id="courtModal"><div class="dialog"><div class="dialog-head"><h2>Nueva cancha</h2><button class="close" id="closeCourtModal" type="button">×</button></div><form class="form" id="courtForm"><div class="form-grid">
  <div class="field full"><label for="courtName">Nombre</label><input id="courtName" name="name" required placeholder="Ej. María Luisa 1"></div>
</div><div class="actions"><button type="button" class="ghost" id="cancelCourtModal">Cancelar</button><button class="save" type="submit">Guardar</button></div></form></div></div>

<div class="toast" id="toast">Guardado</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supa.js"></script>
<script>
const navItems=[['home','⌂','Inicio'],['matches','◫','Partidos'],['tournaments','⚑','Torneos'],['courts','⛳','Canchas'],['clients','◎','Clientes'],['referees','◇','Árbitros'],['observers','👁','Veedores'],['settlements','💰','Liquidaciones'],['finance','$','Finanzas']];
let sb, currentUser;
let raw={clients:[],referees:[],tournaments:[],teams:[],matches:[],match_officials:[],observers:[],match_observers:[],cards:[],courts:[],categories:[],rates:[],settlements:[]};
let data={clients:[],referees:[],tournaments:[],teams:[],matches:[],observers:[],cardsPending:[],courts:[],settlements:[]};
let current='home';

const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusLabel={confirmed:'Confirmado',pending:'Pendiente',finished:'Finalizado',cancelled:'Cancelado'};
function toastMsg(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2800)}
function todayISO(){return new Date().toISOString().slice(0,10)}

async function loadAll(){
  const [c,r,t,tm,m,mo,ob,mob,ca,co,cat,ra,se]=await Promise.all([
    sb.from('clients').select('*').order('name'),
    sb.from('referees').select('*').order('name'),
    sb.from('tournaments').select('*').order('name'),
    sb.from('teams').select('*').order('name'),
    sb.from('matches').select('*'),
    sb.from('match_officials').select('*'),
    sb.from('observers').select('*').order('name'),
    sb.from('match_observers').select('*'),
    sb.from('cards').select('*, matches(name, match_date)').order('created_at',{ascending:false}),
    sb.from('courts').select('*').order('name'),
    sb.from('tournament_categories').select('*').order('name'),
    sb.from('rates').select('*'),
    sb.from('settlements').select('*').order('created_at',{ascending:false}),
  ]);
  raw.clients=c.data||[]; raw.referees=r.data||[]; raw.tournaments=t.data||[]; raw.teams=tm.data||[]; raw.matches=m.data||[];
  raw.match_officials=mo.data||[]; raw.observers=ob.data||[]; raw.match_observers=mob.data||[]; raw.cards=ca.data||[];
  raw.courts=co.data||[]; raw.categories=cat.data||[]; raw.rates=ra.data||[]; raw.settlements=se.data||[];
  buildViewModels();
}

function buildViewModels(){
  const byId=list=>Object.fromEntries(list.map(x=>[x.id,x]));
  const clientById=byId(raw.clients),tournamentById=byId(raw.tournaments),refereeById=byId(raw.referees),observerById=byId(raw.observers);
  const teamById=byId(raw.teams),courtById=byId(raw.courts),categoryById=byId(raw.categories);
  const rateByCategory=Object.fromEntries(raw.rates.map(r=>[r.category_id,r]));
  const centralByMatch={}; raw.match_officials.forEach(o=>{ if(o.role==='central') centralByMatch[o.match_id]=o });
  const obsByMatch=Object.fromEntries(raw.match_observers.map(o=>[o.match_id,o]));
  const pendingByMatch={}; raw.cards.forEach(c=>{ if(!c.paid) pendingByMatch[c.match_id]=(pendingByMatch[c.match_id]||0)+1 });

  data.matches=raw.matches.map(m=>{
    const central=centralByMatch[m.id],obs=obsByMatch[m.id];
    return {
      id:m.id,date:m.match_date,time:(m.match_time||'').slice(0,5),name:m.name,place:m.place,type:m.match_type,status:m.status,
      service:Number(m.service_value)||0,refPay:Number(m.officials_total)||0,
      toSilbatazo:Number(m.client_to_silbatazo)||0,toRef:Number(m.client_to_officials)||0,paidRef:Number(m.silbatazo_to_officials)||0,
      client:m.client_id&&clientById[m.client_id]?clientById[m.client_id].name:'Sin cliente',client_id:m.client_id||'',
      tournament:m.tournament_id&&tournamentById[m.tournament_id]?tournamentById[m.tournament_id].name:'',tournament_id:m.tournament_id||'',
      referee:central&&refereeById[central.referee_id]?refereeById[central.referee_id].name:'Sin asignar',referee_id:central?central.referee_id:'',
      observer:obs&&observerById[obs.observer_id]?observerById[obs.observer_id].name:'Sin asignar',observer_id:obs?obs.observer_id:'',observerFee:obs?Number(obs.agreed_value)||0:0,
      pendingCards:pendingByMatch[m.id]||0,
      category_id:m.category_id||'',category:m.category_id&&categoryById[m.category_id]?categoryById[m.category_id].name:'',
      court_id:m.court_id||'',court:m.court_id&&courtById[m.court_id]?courtById[m.court_id].name:'',
      local_team_id:m.local_team_id||'',visitor_team_id:m.visitor_team_id||'',
      localTeam:m.local_team_id&&teamById[m.local_team_id]?teamById[m.local_team_id].name:'',
      visitorTeam:m.visitor_team_id&&teamById[m.visitor_team_id]?teamById[m.visitor_team_id].name:'',
      serviceType:m.service_type||'completo',arbiterIsObserver:!!m.arbiter_is_observer,
      isWalkover:!!m.is_walkover,wTeamId:m.w_team_id||'',
      teamFee:Number(m.team_fee)||0,silbatazoFee:Number(m.silbatazo_fee)||0,tournamentFee:Number(m.tournament_fee)||0,
    };
  });
  data.clients=raw.clients;
  data.referees=raw.referees;
  data.observers=raw.observers;
  data.courts=raw.courts;
  data.teams=raw.teams;
  data.tournaments=raw.tournaments.map(t=>({...t,
    total:data.matches.filter(m=>m.tournament_id===t.id).length,
    played:data.matches.filter(m=>m.tournament_id===t.id&&m.status==='finished').length,
    categories:raw.categories.filter(c=>c.tournament_id===t.id).map(c=>({...c,rate:rateByCategory[c.id]||null})),
    teams:raw.teams.filter(tm=>tm.tournament_id===t.id),
  }));
  data.cardsPending=raw.cards.filter(c=>!c.paid).map(c=>({...c,matchName:(c.matches&&c.matches.name)||'',matchDate:(c.matches&&c.matches.match_date)||''}));
  data.settlements=raw.settlements.map(s=>({...s,observerName:observerById[s.observer_id]?observerById[s.observer_id].name:'Veedor'}));
}

function courtsView(){
  const rows=data.courts.map(c=>`<article class="entity"><div class="entity-top"><div><h3>${esc(c.name)}</h3></div><span class="status ${c.active?'confirmed':'cancelled'}">${c.active?'Activa':'Inactiva'}</span></div><div class="entity-stats"><div><small>Partidos jugados aquí</small><strong>${data.matches.filter(m=>m.court_id===c.id).length}</strong></div></div><button class="link-btn" onclick="toggleCourt('${c.id}',${c.active})">${c.active?'Desactivar':'Activar'}</button></article>`).join('')||'<div class="empty">Todavía no has agregado ninguna cancha.</div>';
  return `<section class="intro"><div><span class="eyebrow">Catálogo</span><h2>Canchas</h2><p>Se usan al armar partidos, evitando duplicados.</p></div><button class="new" onclick="openCourtModal()">+ Agregar cancha</button></section><div class="entity-grid">${rows}</div>`;
}

function categoriesRows(t){return t.categories.length?t.categories.map(c=>{const r=c.rate;return `<div class="mcard"><div class="who"><b>${esc(c.name)}</b><span class="meta">${r?`Equipo ${money(r.team_fee)} · Árbitro ${money(r.referee_fee)} · Veedor ${money(r.observer_fee)} · Silbatazo ${money(r.silbatazo_fee)} · Torneo ${money(r.tournament_fee)} · 🟨${money(r.yellow_fee)} 🟥${money(r.red_fee)}`:'Sin tarifa configurada'}</span></div><button class="link-btn" onclick="deleteCategory('${c.id}','${t.id}')">Eliminar</button></div>`}).join(''):'<div class="empty">Todavía no hay categorías.</div>'}

      <div class="field"><label for="catTorFee">Valor torneo</label><input id="catTorFee" type="number" min="0" step="1000" value="10000"></div>
      <p id="catSumHint" style="grid-column:1/-1;color:#8b929b;margin:0"></p>
      <div class="section-h">Multas</div>
      <div class="field"><label for="catYellow">Amarilla — total</label><input id="catYellow" type="number" min="0" step="500" value="5000"></div>
      <div class="field"><label for="catYellowSil">Amarilla — Silbatazo</label><input id="catYellowSil" type="number" min="0" step="500" value="2500"></div>
      <div class="field"><label for="catYellowTor">Amarilla — torneo</label><input id="catYellowTor" type="number" min="0" step="500" value="2500"></div>
      <div class="field"><label for="catRed">Roja — total</label><input id="catRed" type="number" min="0" step="500" value="10000"></div>
      <div class="field"><label for="catRedSil">Roja — Silbatazo</label><input id="catRedSil" type="number" min="0" step="500" value="6000"></div>
      <div class="field"><label for="catRedTor">Roja — torneo</label><input id="catRedTor" type="number" min="0" step="500" value="4000"></div>
    </div><div class="actions"><button class="save" type="submit">+ Agregar categoría</button></div></form>
  </div>
  <div class="box"><div class="box-head"><h3>Equipos</h3></div><div id="teamsList" class="match-list">${teamsRows(t)}</div>

function updateCatSumHint(){
  const teamFee=+catTeamFee.value||0,sum=(+catRefFee.value||0)+(+catObsFee.value||0)+(+catSilFee.value||0)+(+catTorFee.value||0),expected=teamFee*2;
  catSumHint.textContent=sum===expected?`✓ La suma cuadra: ${money(sum)}`:`⚠ La suma (${money(sum)}) debería ser ${money(expected)} (valor por equipo × 2)`;
}

  const id=tournamentRulesForm.dataset.id;

  const {error}=await sb.from('tournaments').update({requires_observer:requiresObserver.checked,has_cards:hasCards.checked,arbiter_observer_split_silbatazo_pct:+splitSilbatazo.value||0,arbiter_observer_split_tournament_pct:+splitTorneo.value||0}).eq('id',id);
  btn.disabled=false;btn.textContent='Guardar reglas';
  if(error){toastMsg('No se pudieron guardar las reglas.');return}
  toastMsg('Reglas guardadas.');await loadAll();openTournamentConfig(id);
}

async function deleteTeam(id,tournamentId){

  if(error){toastMsg('No se pudo eliminar (puede tener partidos asociados).');return}

function computeSettlement(observerId,start,end){
  const matches=data.matches.filter(m=>m.observer_id===observerId&&m.status==='finished'&&m.date>=start&&m.date<=end);
  const totals={total_collected:0,total_paid_referees:0,total_cards_collected:0,total_observer:0,total_silbatazo:0,total_tournament:0,w_adjustment:0};
  matches.forEach(m=>{
    const collected=m.isWalkover?m.teamFee:m.teamFee*2;
    totals.total_collected+=collected;
    totals.total_paid_referees+=m.refPay;
    totals.total_observer+=m.observerFee;
    if(m.isWalkover){totals.w_adjustment+=m.silbatazoFee+m.tournamentFee}
    else{totals.total_silbatazo+=m.silbatazoFee;totals.total_tournament+=m.tournamentFee}
    raw.cards.filter(c=>c.match_id===m.id&&c.paid).forEach(c=>{totals.total_cards_collected+=Number(c.fee)||0;totals.total_silbatazo+=Number(c.silbatazo_fee)||0;totals.total_tournament+=Number(c.tournament_fee)||0});
  });
  return {matches,totals};
}
function settlementsView(){
  const rows=data.settlements.map(s=>`<div class="mcard"><div class="who"><b>${esc(s.observerName)}</b><span class="meta">${s.start_date} a ${s.end_date} · ${s.status==='cerrada'?'Cerrada':'Pendiente'}</span></div><div class="money-mini"><b>${money(s.total_silbatazo+s.total_tournament)}</b><small>a transferir</small></div></div>`).join('')||'<div class="empty">Todavía no hay liquidaciones.</div>';
  return `<section class="intro"><div><span class="eyebrow">Cierre semanal</span><h2>Liquidaciones</h2><p>Calculadas a partir de los partidos finalizados de cada veedor.</p></div><button class="new" onclick="openSettlementBuilder()">+ Nueva liquidación</button></section><div class="match-list">${rows}</div>`;
}
function openSettlementBuilder(){
  const today=todayISO(),weekAgo=new Date(Date.now()-7*86400000).toISOString().slice(0,10);
  content.innerHTML=`<section class="intro"><div><button class="link-btn" onclick="render()">← Liquidaciones</button><span class="eyebrow" style="display:block;margin-top:16px">Nueva liquidación</span><h2>Calcular cierre</h2></div></section>
  <div class="box"><div class="form"><div class="form-grid">
    <div class="field"><label for="settleObserver">Veedor</label><select id="settleObserver">${data.observers.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')||'<option value="">Sin veedores</option>'}</select></div>
    <div class="field"><label for="settleStart">Desde</label><input id="settleStart" type="date" value="${weekAgo}"></div>
    <div class="field"><label for="settleEnd">Hasta</label><input id="settleEnd" type="date" value="${today}"></div>
  </div><div class="actions"><button type="button" class="save" id="settleCalcBtn">Calcular</button></div></div></div>
  <div id="settleResult"></div>`;
  pageTitle.textContent='Nueva liquidación';
  settleCalcBtn.onclick=()=>renderSettlementPreview(settleObserver.value,settleStart.value,settleEnd.value);
}
function renderSettlementPreview(observerId,start,end){
  if(!observerId){toastMsg('Elige un veedor.');return}
  const {matches,totals}=computeSettlement(observerId,start,end);
  const observerName=(data.observers.find(o=>o.id===observerId)||{}).name||'Veedor';
  settleResult.innerHTML=`<div class="box money"><div class="box-head"><h3>Resumen — ${esc(observerName)}</h3></div><div class="money-list">
    <div class="money-row"><span>Partidos incluidos</span><strong>${matches.length}</strong></div>
    <div class="money-row"><span>Total recaudado</span><strong>${money(totals.total_collected)}</strong></div>
    <div class="money-row"><span>Pagado a árbitros</span><strong>${money(totals.total_paid_referees)}</strong></div>
    <div class="money-row"><span>Multas cobradas</span><strong>${money(totals.total_cards_collected)}</strong></div>
    <div class="money-row"><span>Se queda el veedor</span><strong>${money(totals.total_observer)}</strong></div>
    <div class="money-row"><span>Transferir a Silbatazo</span><strong>${money(totals.total_silbatazo)}</strong></div>
    <div class="money-row"><span>Transferir al torneo</span><strong>${money(totals.total_tournament)}</strong></div>
    <div class="money-row"><span>Ajuste por partidos "por W" (debe el torneo)</span><strong>${money(totals.w_adjustment)}</strong></div>
  </div></div>
  <div class="match-list">${matches.length?matches.map(m=>`<div class="mcard"><div class="who"><b>${esc(m.name)}</b><span class="meta">${m.date} · ${esc(m.category||m.tournament||'Partido suelto')}${m.isWalkover?' · Por W':''}</span></div><div class="money-mini"><b>${money(m.isWalkover?m.teamFee:m.teamFee*2)}</b><small>recaudado</small></div></div>`).join(''):'<div class="empty">No hay partidos finalizados de este veedor en ese rango.</div>'}</div>
  <div class="actions"><button class="save" id="closeSettlementBtn">Cerrar liquidación</button></div>`;
  closeSettlementBtn.onclick=()=>closeSettlement(observerId,start,end,totals,matches);
}
async function closeSettlement(observerId,start,end,totals,matches){
  const btn=closeSettlementBtn;btn.disabled=true;btn.textContent='Guardando…';
  const {data:settlement,error}=await sb.from('settlements').insert({observer_id:observerId,start_date:start,end_date:end,status:'cerrada',closed_at:new Date().toISOString(),total_collected:totals.total_collected,total_paid_referees:totals.total_paid_referees,total_cards_collected:totals.total_cards_collected,total_observer:totals.total_observer,total_silbatazo:totals.total_silbatazo,total_tournament:totals.total_tournament,w_adjustment:totals.w_adjustment}).select().single();
  if(error){btn.disabled=false;btn.textContent='Cerrar liquidación';toastMsg('No se pudo cerrar la liquidación.');return}
  if(matches.length){await sb.from('settlement_matches').insert(matches.map(m=>({settlement_id:settlement.id,match_id:m.id})))}
  toastMsg('Liquidación cerrada.');current='settlements';await loadAll();render();
}

function onTournamentChange(){
  const t=data.tournaments.find(x=>x.id===tournament.value);
  if(t&&t.categories.length){categoryField.hidden=false;category.innerHTML='<option value="">Elige una categoría…</option>'+t.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}

  if(t&&t.teams.length){localTeamField.hidden=false;visitorTeamField.hidden=false;const opts='<option value="">Elige un equipo…</option>'+t.teams.map(tm=>`<option value="${tm.id}">${esc(tm.name)}</option>`).join('');localTeam.innerHTML=opts;visitorTeam.innerHTML=opts}

}
function onCategoryChange(){
  const t=data.tournaments.find(x=>x.id===tournament.value);
  const cat=t&&t.categories.find(c=>c.id===category.value);
  const rate=cat&&cat.rate;
  if(rate){service.value=rate.team_fee*2;refPay.value=rate.referee_fee;observerFee.value=rate.observer_fee;advTouched=false;toSilbatazo.value=rate.silbatazo_fee;toRef.value=rate.referee_fee;paidRef.value=0}
  calcMoney();
}

function calcMoney(){const s=+service.value||0,r=+refPay.value||0;if(!advTouched){const half=Math.round(s/2/1000)*1000;toSilbatazo.value=half;toRef.value=s-half}const si=+toSilbatazo.value||0,tr=+toRef.value||0,pr=+paidRef.value||0;profitCalc.textContent=money(s-r);debtCalc.textContent=money(Math.max(0,r-tr-pr));clientDebtCalc.textContent=money(Math.max(0,s-si-tr))}['service','refPay','toSilbatazo','toRef','paidRef'].forEach(id=>document.getElementById(id).addEventListener('input',calcMoney));

matchForm.onsubmit=async e=>{
  e.preventDefault();
  const f=Object.fromEntries(new FormData(matchForm));
  const saveBtn=matchForm.querySelector('.save');saveBtn.disabled=true;saveBtn.textContent='Guardando…';

  const placeName=f.place.trim();
  let courtId=null;
  if(placeName){
    const existing=data.courts.find(c=>c.name.toLowerCase()===placeName.toLowerCase());
    if(existing){courtId=existing.id}
    else{const {data:newCourt,error:courtErr}=await sb.from('courts').insert({name:placeName}).select().single();if(!courtErr&&newCourt)courtId=newCourt.id}
  }

  const tour=data.tournaments.find(x=>x.id===f.tournament);
  const categoryId=category.value||null;
  const cat=categoryId&&tour?tour.categories.find(c=>c.id===categoryId):null;
  const rate=cat&&cat.rate;
  const isSolo=soloArbitraje.checked,isArbObserver=arbiterIsObserver.checked;

  let teamFeeSnap=0,silbatazoFeeSnap=0,tournamentFeeSnap=0,serviceValue=+f.service||0,officialsTotal=+f.refPay||0,matchName=f.name,observerAgreedValue=+f.observerFee||0;
  if(rate){
    teamFeeSnap=rate.team_fee;officialsTotal=rate.referee_fee;serviceValue=rate.team_fee*2;observerAgreedValue=rate.observer_fee;
    if(isSolo){silbatazoFeeSnap=Math.max(0,serviceValue-officialsTotal);tournamentFeeSnap=0}
    else if(isArbObserver){
      const silPct=(tour.arbiter_observer_split_silbatazo_pct??50)/100,torPct=(tour.arbiter_observer_split_tournament_pct??50)/100;
      silbatazoFeeSnap=rate.silbatazo_fee+Math.round(rate.observer_fee*silPct);tournamentFeeSnap=rate.tournament_fee+Math.round(rate.observer_fee*torPct);
    } else {silbatazoFeeSnap=rate.silbatazo_fee;tournamentFeeSnap=rate.tournament_fee}
    if(localTeam.value&&visitorTeam.value){
      const lt=data.teams.find(t=>t.id===localTeam.value),vt=data.teams.find(t=>t.id===visitorTeam.value);
      if(lt&&vt)matchName=`${lt.name} vs ${vt.name}`;
    }
  }

  const payload={
    name:matchName,match_date:f.date,match_time:f.time,place:placeName,match_type:f.type,status:f.status,
    client_id:f.client||null,tournament_id:f.tournament||null,
    service_value:serviceValue,officials_total:officialsTotal,
    client_to_silbatazo:+f.toSilbatazo||0,client_to_officials:+f.toRef||0,silbatazo_to_officials:+f.paidRef||0,
    notes:f.notes||null,created_by:currentUser.id,
    court_id:courtId,category_id:categoryId,
    local_team_id:localTeam.value||null,visitor_team_id:visitorTeam.value||null,
    service_type:isSolo?'solo_arbitraje':'completo',arbiter_is_observer:isArbObserver,
    team_fee:teamFeeSnap,silbatazo_fee:silbatazoFeeSnap,tournament_fee:tournamentFeeSnap,
  };
  const {data:inserted,error}=await sb.from('matches').insert(payload).select().single();
  if(error){toastMsg('No se pudo guardar el partido.');saveBtn.disabled=false;saveBtn.textContent='Guardar partido';return}
  const matchId=inserted.id;
  if(f.referee){await sb.from('match_officials').insert({match_id:matchId,referee_id:f.referee,role:'central',agreed_value:officialsTotal})}
  if(f.observer&&!isArbObserver&&!isSolo){await sb.from('match_observers').insert({match_id:matchId,observer_id:f.observer,agreed_value:observerAgreedValue})}
  saveBtn.disabled=false;saveBtn.textContent='Guardar partido';
  hideModal();matchForm.reset();toastMsg('Partido guardado correctamente');current='matches';
  await loadAll();render();
};

  e.preventDefault();
  const f=Object.fromEntries(new FormData(veedorForm));
  const btn=veedorForm.querySelector('.save');btn.disabled=true;btn.textContent='Creando…';
  try{
    const {data:{session}}=await sb.auth.getSession();
    const res=await fetch('/api/create-veedor',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({name:f.name,phone:f.phone,email:f.email})});
    const out=await res.json();
    btn.disabled=false;btn.textContent='Guardar';
    if(!out.ok){toastMsg(out.error||'No se pudo crear el veedor.');return}
    veedorForm.hidden=true;veedorResult.hidden=false;
    veedorResult.innerHTML=`<p>Veedor creado. Comparte estos datos por WhatsApp:</p><p><b>Correo:</b> ${esc(out.email)}<br><b>Contraseña:</b> ${esc(out.password)}</p><p style="color:#8b929b;font-size:.85rem">La puede cambiar más adelante; por ahora entra con esta en veedor.html.</p>`;
    await loadAll();
  }catch(err){btn.disabled=false;btn.textContent='Guardar';toastMsg('No se pudo crear el veedor.')}
};

logoutBtn.onclick=async()=>{await SilbatazoAuth.signOut();window.location.reload()};

(async function boot(){
  const session=await SilbatazoAuth.requireRole('admin',{title:'Panel administrativo',logoSrc:'assets/logos/silbato.png'});
  sb=session.client;currentUser=session.profile;
  userName.textContent=currentUser.full_name||'Administrador';
  userAvatar.textContent=(currentUser.full_name||'A').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  today.textContent=new Intl.DateTimeFormat('es-CO',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
  await loadAll();
  render();
})();
</script>
</body>
