  <style>

    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eef0f2;color:var(--ink);font-family:var(--body);font-size:16px}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}.app{min-height:100svh;display:grid;grid-template-columns:240px 1fr}.side{background:var(--ink);color:#fff;padding:24px 18px;position:sticky;top:0;height:100svh;display:flex;flex-direction:column;z-index:10}.side-logo{width:195px;max-width:100%;height:auto;margin:0 6px 28px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aeb4bf;text-align:left;padding:16px 14px;min-height:52px;border-radius:9px;font-weight:800;font-size:1rem;cursor:pointer;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:var(--brand);color:var(--ink)}.nav i{font-style:normal;width:22px;text-align:center;font-size:1.15rem}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:18px}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:var(--ink);font-weight:900}.side-foot small{color:var(--gray)}.public{display:block;margin-top:14px;color:var(--brand);font-size:.82rem;font-weight:800}.side-foot .logout{display:block;margin-top:8px;border:0;background:none;color:var(--muted);font-size:.82rem;font-weight:800;padding:0;cursor:pointer;text-align:left}.main{min-width:0}.topbar{height:76px;padding:0 clamp(18px,4vw,46px);display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #d9dce0;position:sticky;top:0;z-index:5}.topbar h1{font:900 clamp(1.7rem,4vw,2.2rem)/1 var(--display);text-transform:uppercase;margin:0}.today{color:#707782;font-size:.85rem}.topbar-actions{display:flex;align-items:center;gap:10px}.new{border:0;border-radius:10px;padding:16px 20px;min-height:52px;background:var(--brand);color:var(--ink);font-weight:900;font-size:1rem;text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}.content{padding:34px clamp(18px,4vw,46px) 90px;max-width:1500px}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:26px}.eyebrow{color:#008b5e;font-weight:900;text-transform:uppercase;letter-spacing:.11em;font-size:.76rem}.intro h2{margin:6px 0 4px;font:900 clamp(2.8rem,7vw,5rem)/.85 var(--display);text-transform:uppercase;letter-spacing:-.035em}.intro p{margin:0;color:#66707b}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}.metric{background:#fff;border:1px solid #dfe2e5;padding:20px;border-radius:12px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:4px;background:var(--accent,var(--brand))}.metric small{font-weight:800;color:#69727e;text-transform:uppercase}.metric strong{font:900 2.7rem/1 var(--display);display:block;margin-top:10px}.metric span{font-size:.8rem;color:#7c8490}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.75fr);gap:16px}.box{background:#fff;border:1px solid #dfe2e5;border-radius:12px;overflow:hidden}.box-head{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e7ea}.box-head h3{font:900 1.45rem/1 var(--display);text-transform:uppercase;margin:0}.box-head button{border:0;background:none;color:#007d56;font-weight:900;cursor:pointer}.match{padding:16px 20px;display:grid;grid-template-columns:82px 1fr auto;gap:14px;align-items:center;border-bottom:1px solid #eceef0}.match:last-child{border:0}.time{font:900 1.25rem/1 var(--display)}.time small{display:block;margin-top:5px;color:#8b929b;font:700 .7rem/1 var(--body);text-transform:uppercase}.match b{display:block;margin-bottom:5px}.meta{color:#737b86;font-size:.82rem}.status{padding:6px 9px;border-radius:100px;font-weight:900;font-size:.7rem;text-transform:uppercase;white-space:nowrap}.confirmed{background:#d7f8e8;color:#007148}.pending{background:#fff0bf;color:#825d00}.finished{background:#e4e8ee;color:#4d5662}.cancelled{background:#ffe0df;color:#a12520}.money{background:var(--ink);color:#fff}.money .box-head{border-color:var(--line)}.money-list{padding:14px 20px}.money-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.money-row:last-child{border:0}.money-row span{color:#b8bec7;font-size:.86rem}.money-row strong{color:var(--yellow)}.alert{margin:0 20px 20px;padding:14px;border:1px solid rgba(255,190,44,.4);background:rgba(255,190,44,.1);border-radius:8px;font-size:.82rem;line-height:1.45}.view{display:none}.view.active{display:block}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.search{flex:1;min-width:220px;border:1px solid #d5d9de;background:#fff;padding:12px 14px;border-radius:8px}.filter{border:1px solid #d5d9de;background:#fff;padding:12px;border-radius:8px}.table-wrap{background:#fff;border:1px solid #dfe2e5;border-radius:12px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:15px 17px;text-align:left;border-bottom:1px solid #eceef0}th{font-size:.72rem;text-transform:uppercase;color:#717a85;background:#f7f8f9}td{font-size:.9rem}tr:last-child td{border:0}.link-btn{border:0;background:none;color:#007d56;font-weight:900;cursor:pointer;padding:10px 2px;min-height:44px;font-size:.95rem}
    .match-list{background:#fff;border:1px solid #dfe2e5;border-radius:12px;overflow:hidden}.mcard{padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;border-bottom:1px solid #eceef0}.mcard:last-child{border:0}.mcard .time{min-width:64px}.mcard .who{flex:1;min-width:180px}.mcard .who b{display:block;font-size:1.02rem}.mcard .money-mini{text-align:right;min-width:110px}.mcard .money-mini b{display:block;font:900 1.15rem var(--display)}.mcard .money-mini small{color:#8b929b}.entity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.entity{background:#fff;border:1px solid #dfe2e5;border-radius:12px;padding:20px}.entity-top{display:flex;justify-content:space-between;gap:12px}.entity h3{margin:0 0 5px}.entity p{color:#737b86;font-size:.84rem}.entity-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}.entity-stats div{background:#f2f4f5;border-radius:8px;padding:10px}.entity-stats small{display:block;color:#737b86}.entity-stats strong{font:900 1.3rem var(--display)}.tournament{grid-column:span 1}.progress{height:7px;border-radius:10px;background:#e1e4e7;overflow:hidden;margin-top:15px}.progress i{display:block;height:100%;background:var(--brand)}.empty{padding:35px;text-align:center;color:#737b86}.subhead{margin:30px 2px 12px;font:900 1.3rem var(--display);text-transform:uppercase;color:#3b434c}.mobile-nav{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:none;place-items:center;padding:18px}.modal.open{display:grid}.dialog{width:min(760px,100%);max-height:92svh;overflow:auto;background:#fff;border-radius:14px}.dialog-head{padding:20px 22px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0;font:900 2rem/1 var(--display);text-transform:uppercase}.close{border:0;background:none;color:#fff;font-size:1.8rem;cursor:pointer}.form{padding:22px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:.85rem;font-weight:900;text-transform:uppercase;color:#606a75}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd1d7;border-radius:9px;padding:14px;min-height:50px;font-size:1.05rem;background:#fff}.section-h{grid-column:1/-1;margin:6px 0 -4px;font:900 .95rem/1 var(--body);text-transform:uppercase;color:#8b929b;letter-spacing:.04em}
    .financial{grid-column:1/-1;background:#f1f3f4;border-radius:10px;padding:16px}.financial h3{font:900 1.2rem var(--display);text-transform:uppercase;margin:0 0 12px}.calc{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.calc div{padding:10px;background:#fff;border-radius:7px}.calc small{display:block;color:#6d7680}.calc strong{font:900 1.3rem var(--display)}
    .money-basic{display:grid;grid-template-columns:1fr 1fr;gap:14px}.money-result{margin-top:14px;background:var(--ink);color:#fff;border-radius:8px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.money-result small{color:#aeb4bf;text-transform:uppercase;font-weight:800;font-size:.72rem}.money-result strong{font:900 1.6rem var(--display);color:var(--brand)}
    .adv-toggle{margin-top:14px;border:0;background:none;color:#007d56;font-weight:900;padding:10px 2px;min-height:44px;cursor:pointer;text-decoration:underline}.adv-panel{margin-top:6px}.adv-panel[hidden]{display:none}
    .actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}.ghost{border:1px solid #ccd1d7;background:#fff;border-radius:9px;padding:15px 20px;min-height:50px;font-weight:900;font-size:1rem;cursor:pointer}.save{border:0;background:var(--brand);border-radius:9px;padding:15px 24px;min-height:50px;font-weight:900;font-size:1rem;cursor:pointer}.save[disabled],.ghost[disabled]{opacity:.55;cursor:default}.toast{position:fixed;right:20px;bottom:20px;left:20px;background:var(--ink);color:#fff;padding:14px 18px;border-left:5px solid var(--brand);border-radius:8px;z-index:50;transform:translateY(120px);transition:.25s;max-width:420px;margin-left:auto}.toast.show{transform:none}
    @media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.entity-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:720px){.app{display:block}.side{display:none}.topbar{height:68px;padding:0 16px}.today{display:none}.new{padding:11px 13px;font-size:.75rem}.content{padding:24px 14px 95px}.intro h2{font-size:3.1rem}.cards{gap:8px}.metric{padding:15px}.metric strong{font-size:2.2rem}.match{grid-template-columns:68px 1fr}.match .status{grid-column:2}.entity-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full,.financial{grid-column:auto}.calc{grid-template-columns:1fr}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(7,1fr);left:0;right:0;bottom:0;height:76px;background:var(--ink);z-index:20}.mobile-nav button{border:0;background:none;color:#8f97a3;font-size:.62rem;font-weight:800;padding:8px 2px;min-height:76px}.mobile-nav button.active{color:var(--brand)}.mobile-nav i{display:block;font-style:normal;font-size:1.25rem;margin-bottom:4px}.foot-hide{display:none}.money-basic{grid-template-columns:1fr}.mcard{padding:14px}.mcard .money-mini{text-align:left}}
  </style>

<body>
<div class="app">
  <aside class="side"><img class="side-logo" src="assets/logos/logo-completo.png" alt="Silbatazo"><nav class="nav" id="desktopNav"></nav><div class="side-foot"><div class="user"><span class="avatar" id="userAvatar">A</span><div><b id="userName">Administrador</b><small>Equipo Silbatazo</small></div></div><a class="public" href="silbatazo_landing_disruptiva.html">← Volver a la web pública</a><button class="logout" id="logoutBtn" type="button">Cerrar sesión</button></div></aside>
  <main class="main"><header class="topbar"><div><h1 id="pageTitle">Inicio</h1><span class="today" id="today"></span></div><div class="topbar-actions"><button class="new" id="newMatch">+ Nuevo partido</button></div></header><div class="content" id="content"></div></main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h2>Nuevo partido</h2><button class="close" id="closeModalBtn" type="button" aria-label="Cerrar">×</button></div><form class="form" id="matchForm"><div class="form-grid">
  <div class="section-h">¿Cuándo y dónde?</div>
  <div class="field"><label for="date">Fecha</label><input id="date" name="date" type="date" required></div><div class="field"><label for="time">Hora</label><input id="time" name="time" type="time" required></div>
  <div class="field full"><label for="place">Lugar</label><input id="place" name="place" placeholder="Cancha y municipio" required></div>
  <div class="section-h">¿Quién juega?</div>
  <div class="field full"><label for="name">Partido / equipos</label><input id="name" name="name" placeholder="Ej. Los del Barrio vs Amigos FC" required></div>
  <div class="field"><label for="client">Cliente</label><select id="client" name="client"></select></div><div class="field"><label for="type">Tipo</label><select id="type" name="type"><option>Amistoso</option><option>Torneo</option><option>Promocional</option><option>Normal</option><option>Otro</option></select></div><div class="field full"><label for="tournament">Torneo / jornada</label><select id="tournament" name="tournament"><option value="">Partido independiente</option></select></div>
  <div class="section-h">Árbitro</div>
  <div class="field"><label for="referee">Árbitro central</label><select id="referee" name="referee"></select></div><div class="field"><label for="status">Estado</label><select id="status" name="status"><option value="pending">Pendiente de árbitro</option><option value="confirmed">Confirmado</option><option value="finished">Finalizado</option><option value="cancelled">Cancelado</option></select></div>
  <div class="section-h">Veedor</div>
  <div class="field"><label for="observer">Veedor asignado</label><select id="observer" name="observer"></select></div><div class="field"><label for="observerFee">Pago al veedor</label><input id="observerFee" name="observerFee" type="number" min="0" step="1000" value="0"></div>
  <div class="financial"><h3>Dinero</h3><div class="money-basic"><div class="field"><label for="service">Cobras al cliente</label><input id="service" name="service" type="number" min="0" step="1000" value="80000"></div><div class="field"><label for="refPay">Le pagas al árbitro</label><input id="refPay" name="refPay" type="number" min="0" step="1000" value="70000"></div></div><div class="money-result"><small>Tu utilidad</small><strong id="profitCalc">$10.000</strong></div>
    <button type="button" class="adv-toggle" id="advToggle">Ajustar quién le paga a quién ↓</button>
    <div class="adv-panel" id="advPanel" hidden><div class="form-grid"><div class="field"><label for="toSilbatazo">Cliente → Silbatazo</label><input id="toSilbatazo" name="toSilbatazo" type="number" min="0" step="1000" value="40000"></div><div class="field"><label for="toRef">Cliente → árbitros</label><input id="toRef" name="toRef" type="number" min="0" step="1000" value="40000"></div><div class="field"><label for="paidRef">Silbatazo → árbitros</label><input id="paidRef" name="paidRef" type="number" min="0" step="1000" value="0"></div></div><div class="calc"><div><small>Debemos al árbitro</small><strong id="debtCalc">$30.000</strong></div><div><small>Cliente debe</small><strong id="clientDebtCalc">$0</strong></div></div></div>
  </div>
  <div class="field full"><label for="notes">Observaciones</label><textarea id="notes" name="notes" rows="2"></textarea></div>
  </div><div class="actions"><button type="button" class="ghost" id="cancelModal">Cancelar</button><button class="save" type="submit">Guardar partido</button></div></form></div></div>

<div class="modal" id="clientModal"><div class="dialog"><div class="dialog-head"><h2>Nuevo cliente</h2><button class="close" id="closeClientModal" type="button">×</button></div><form class="form" id="clientForm"><div class="form-grid">
  <div class="field full"><label for="clientName">Nombre</label><input id="clientName" name="name" required></div>
  <div class="field"><label for="clientPhone">Teléfono</label><input id="clientPhone" name="phone"></div>
  <div class="field"><label for="clientType">Tipo</label><select id="clientType" name="type"><option value="person">Persona</option><option value="company">Empresa</option><option value="tournament">Torneo</option></select></div>
</div><div class="actions"><button type="button" class="ghost" id="cancelClientModal">Cancelar</button><button class="save" type="submit">Guardar</button></div></form></div></div>

<div class="modal" id="refereeModal"><div class="dialog"><div class="dialog-head"><h2>Nuevo árbitro</h2><button class="close" id="closeRefereeModal" type="button">×</button></div><form class="form" id="refereeForm"><div class="form-grid">
  <div class="field full"><label for="refereeName">Nombre</label><input id="refereeName" name="name" required></div>
  <div class="field"><label for="refereePhone">Teléfono</label><input id="refereePhone" name="phone"></div>
  <div class="field"><label for="refereeAvailable">Disponibilidad</label><input id="refereeAvailable" name="availability" placeholder="Ej. Fines de semana"></div>
  <div class="field full" style="display:flex;align-items:center;gap:10px;flex-direction:row"><input id="refereePromo" name="promo" type="checkbox" style="width:22px;height:22px;min-height:0"><label for="refereePromo" style="text-transform:none;font-weight:700">Acepta promociones / partidos con descuento</label></div>
</div><div class="actions"><button type="button" class="ghost" id="cancelRefereeModal">Cancelar</button><button class="save" type="submit">Guardar</button></div></form></div></div>

<div class="modal" id="tournamentModal"><div class="dialog"><div class="dialog-head"><h2>Nuevo torneo</h2><button class="close" id="closeTournamentModal" type="button">×</button></div><form class="form" id="tournamentForm"><div class="form-grid">
  <div class="field full"><label for="tournamentName">Nombre</label><input id="tournamentName" name="name" required></div>
  <div class="field full"><label for="tournamentNotes">Notas</label><textarea id="tournamentNotes" name="notes" rows="2"></textarea></div>
</div><div class="actions"><button type="button" class="ghost" id="cancelTournamentModal">Cancelar</button><button class="save" type="submit">Guardar</button></div></form></div></div>

<div class="modal" id="veedorModal"><div class="dialog"><div class="dialog-head"><h2>Nuevo veedor</h2><button class="close" id="closeVeedorModal" type="button">×</button></div>
<form class="form" id="veedorForm"><div class="form-grid">
  <div class="field full"><label for="veedorName">Nombre</label><input id="veedorName" name="name" required></div>
  <div class="field"><label for="veedorPhone">Teléfono</label><input id="veedorPhone" name="phone"></div>
  <div class="field"><label for="veedorEmail">Correo (para el login)</label><input id="veedorEmail" name="email" type="email" required></div>
</div><div class="actions"><button type="button" class="ghost" id="cancelVeedorModal">Cancelar</button><button class="save" type="submit">Guardar</button></div></form>
<div class="form" id="veedorResult" hidden></div>
</div></div>

<div class="toast" id="toast">Guardado</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supa.js"></script>
<script>
const navItems=[['home','⌂','Inicio'],['matches','◫','Partidos'],['tournaments','⚑','Torneos'],['clients','◎','Clientes'],['referees','◇','Árbitros'],['observers','👁','Veedores'],['finance','$','Finanzas']];
let sb, currentUser;
let raw={clients:[],referees:[],tournaments:[],matches:[],match_officials:[],observers:[],match_observers:[],cards:[]};
let data={clients:[],referees:[],tournaments:[],matches:[],observers:[],cardsPending:[]};
let current='home';

const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusLabel={confirmed:'Confirmado',pending:'Pendiente',finished:'Finalizado',cancelled:'Cancelado'};
function toastMsg(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2800)}
function todayISO(){return new Date().toISOString().slice(0,10)}

async function loadAll(){
  const [c,r,t,m,mo,ob,mob,ca]=await Promise.all([
    sb.from('clients').select('*').order('name'),
    sb.from('referees').select('*').order('name'),
    sb.from('tournaments').select('*').order('name'),
    sb.from('matches').select('*'),
    sb.from('match_officials').select('*'),
    sb.from('observers').select('*').order('name'),
    sb.from('match_observers').select('*'),
    sb.from('cards').select('*, matches(name, match_date)').order('created_at',{ascending:false}),
  ]);
  raw.clients=c.data||[]; raw.referees=r.data||[]; raw.tournaments=t.data||[]; raw.matches=m.data||[];
  raw.match_officials=mo.data||[]; raw.observers=ob.data||[]; raw.match_observers=mob.data||[]; raw.cards=ca.data||[];
  buildViewModels();
}

function buildViewModels(){
  const byId=list=>Object.fromEntries(list.map(x=>[x.id,x]));
  const clientById=byId(raw.clients),tournamentById=byId(raw.tournaments),refereeById=byId(raw.referees),observerById=byId(raw.observers);
  const centralByMatch={}; raw.match_officials.forEach(o=>{ if(o.role==='central') centralByMatch[o.match_id]=o });
  const obsByMatch=Object.fromEntries(raw.match_observers.map(o=>[o.match_id,o]));
  const pendingByMatch={}; raw.cards.forEach(c=>{ if(!c.paid) pendingByMatch[c.match_id]=(pendingByMatch[c.match_id]||0)+1 });

  data.matches=raw.matches.map(m=>{
    const central=centralByMatch[m.id],obs=obsByMatch[m.id];
    return {
      id:m.id,date:m.match_date,time:(m.match_time||'').slice(0,5),name:m.name,place:m.place,type:m.match_type,status:m.status,
      service:Number(m.service_value)||0,refPay:Number(m.officials_total)||0,
      toSilbatazo:Number(m.client_to_silbatazo)||0,toRef:Number(m.client_to_officials)||0,paidRef:Number(m.silbatazo_to_officials)||0,
      client:m.client_id&&clientById[m.client_id]?clientById[m.client_id].name:'Sin cliente',client_id:m.client_id||'',
      tournament:m.tournament_id&&tournamentById[m.tournament_id]?tournamentById[m.tournament_id].name:'',tournament_id:m.tournament_id||'',
      referee:central&&refereeById[central.referee_id]?refereeById[central.referee_id].name:'Sin asignar',referee_id:central?central.referee_id:'',
      observer:obs&&observerById[obs.observer_id]?observerById[obs.observer_id].name:'Sin asignar',observer_id:obs?obs.observer_id:'',observerFee:obs?Number(obs.agreed_value)||0:0,
      pendingCards:pendingByMatch[m.id]||0,
    };
  });
  data.clients=raw.clients;
  data.referees=raw.referees;
  data.observers=raw.observers;
  data.tournaments=raw.tournaments.map(t=>({...t,total:data.matches.filter(m=>m.tournament_id===t.id).length,played:data.matches.filter(m=>m.tournament_id===t.id&&m.status==='finished').length}));
  data.cardsPending=raw.cards.filter(c=>!c.paid).map(c=>({...c,matchName:(c.matches&&c.matches.name)||'',matchDate:(c.matches&&c.matches.match_date)||''}));
}

function nav(){const html=navItems.map(([id,icon,label])=>`<button data-view="${id}" class="${current===id?'active':''}"><i>${icon}</i>${label}</button>`).join('');desktopNav.innerHTML=html;mobileNav.innerHTML=navItems.map(([id,icon,label])=>`<button data-view="${id}" class="${current===id?'active':''}"><i>${icon}</i>${label}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{current=b.dataset.view;render()})}
function matchRow(m){return `<div class="match"><div class="time">${m.time}<small>${(m.date||'').slice(5).replace('-','/')}</small></div><div><b>${esc(m.name)}</b><span class="meta">📍 ${esc(m.place)} · ⚖ ${esc(m.referee)}</span></div><span class="status ${m.status}">${statusLabel[m.status]}</span></div>`}
function dashboard(){const matches=data.matches;const pending=matches.filter(m=>m.status==='pending').length;const total=matches.reduce((a,m)=>a+m.service,0);const refPay=matches.reduce((a,m)=>a+m.refPay,0);const paid=matches.reduce((a,m)=>a+m.toSilbatazo+m.toRef,0);return `<section class="intro"><div><span class="eyebrow">Control operativo</span><h2>Todo bajo control.</h2><p>Lo importante de Silbatazo, sin vueltas.</p></div></section><section class="cards"><div class="metric"><small>Partidos hoy</small><strong>${matches.filter(m=>m.date===todayISO()).length}</strong><span>Agenda del día</span></div><div class="metric" style="--accent:var(--yellow)"><small>Sin árbitro</small><strong>${pending}</strong><span>Requieren acción</span></div><div class="metric"><small>Total registrados</small><strong>${matches.length}</strong><span>${matches.filter(m=>m.status==='confirmed').length} confirmados</span></div><div class="metric" style="--accent:var(--yellow)"><small>Utilidad estimada</small><strong>${money(total-refPay)}</strong><span>Según partidos registrados</span></div></section><section class="grid"><div class="box"><div class="box-head"><h3>Próximos partidos</h3><button data-go="matches">Ver todos</button></div>${matches.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6).map(matchRow).join('')||'<div class="empty">Todavía no hay partidos registrados.</div>'}</div><div class="box money"><div class="box-head"><h3>Resumen financiero</h3></div><div class="money-list"><div class="money-row"><span>Servicios registrados</span><strong>${money(total)}</strong></div><div class="money-row"><span>Pagado por clientes</span><strong>${money(paid)}</strong></div><div class="money-row"><span>Pendiente por cobrar</span><strong>${money(total-paid)}</strong></div><div class="money-row"><span>Pago acordado árbitros</span><strong>${money(refPay)}</strong></div></div><p class="alert">La utilidad se calcula por partido. No se presupone un porcentaje fijo.</p></div></section>`}
function matchesView(){return `<section class="intro"><div><span class="eyebrow">Operación</span><h2>Partidos</h2><p>Agenda, asignaciones y dinero en un solo lugar.</p></div></section><div class="toolbar"><input class="search" id="matchSearch" placeholder="Buscar partido, cliente o árbitro…"><select class="filter" id="statusFilter"><option value="">Todos los estados</option><option value="pending">Pendiente</option><option value="confirmed">Confirmado</option><option value="finished">Finalizado</option><option value="cancelled">Cancelado</option></select></div><div class="match-list" id="matchTable">${matchCards(data.matches)}</div>`}
function matchCards(list){return list.map(m=>`<div class="mcard"><div class="time">${m.time}<small>${(m.date||'').slice(5).replace('-','/')}</small></div><div class="who"><b>${esc(m.name)}</b><span class="meta">📍 ${esc(m.place)} · ⚖ ${esc(m.referee)} · ${esc(m.client)}${m.pendingCards?' · ⚠ '+m.pendingCards+' tarjeta(s) pendiente(s)':''}</span></div><div class="money-mini"><b>${money(m.service-m.refPay)}</b><small>utilidad</small></div><span class="status ${m.status}">${statusLabel[m.status]}</span></div>`).join('')||`<div class="empty">No encontramos partidos.</div>`}
function tournamentsView(){return `<section class="intro"><div><span class="eyebrow">Grupos de partidos</span><h2>Torneos</h2><p>Cada partido conserva su precio, árbitros y pagos.</p></div><button class="new" onclick="openTournamentModal()">+ Crear torneo</button></section><div class="entity-grid">${data.tournaments.map(t=>{const statusText=t.status==='active'?'Activo':t.status==='finished'?'Finalizado':t.status==='cancelled'?'Cancelado':'Borrador';const statusClass=t.status==='active'?'confirmed':t.status==='finished'?'finished':t.status==='cancelled'?'cancelled':'pending';return `<article class="entity tournament"><div class="entity-top"><div><h3>${esc(t.name)}</h3><p>${statusText}</p></div><span class="status ${statusClass}">${statusText}</span></div><div class="entity-stats"><div><small>Partidos</small><strong>${t.total}</strong></div><div><small>Jugados</small><strong>${t.played}</strong></div></div><div class="progress"><i style="width:${t.total?Math.min(100,t.played/t.total*100):0}%"></i></div><p><b>${t.total-t.played}</b> partidos pendientes</p><button class="link-btn" onclick="openTournament('${t.id}')">Ver jornada completa →</button></article>`}).join('')||'<div class="empty">Todavía no has creado ningún torneo.</div>'}</div>`}
function openTournament(id){const t=data.tournaments.find(x=>x.id===id);const list=data.matches.filter(m=>m.tournament_id===id).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));content.innerHTML=`<section class="intro"><div><button class="link-btn" onclick="render()">← Todos los torneos</button><span class="eyebrow" style="display:block;margin-top:16px">Jornada completa</span><h2>${esc(t.name)}</h2><p>${list.length} partidos registrados</p></div><button class="new" onclick="openMatchForTournament('${id}')">+ Agregar partido</button></section><div class="box"><div class="box-head"><h3>Partidos del torneo</h3></div>${list.length?list.map(matchRow).join(''):'<div class="empty">Todavía no hay partidos registrados.</div>'}</div>`;pageTitle.textContent=t.name}
function openMatchForTournament(id){openModal();document.getElementById('type').value='Torneo';document.getElementById('tournament').value=id}
function clientsView(){return entityView('Clientes','Historial, cartera y contacto.',data.clients,c=>({sub:`${c.type==='company'?'Empresa':c.type==='tournament'?'Torneo':'Persona'} · ${c.phone||'sin teléfono'}`,a:'Partidos',av:data.matches.filter(m=>m.client===c.name).length,b:'Facturado',bv:money(data.matches.filter(m=>m.client===c.name).reduce((x,m)=>x+m.service,0))}),'openClientModal()')}
function refereesView(){return entityView('Árbitros','Asignaciones y pagos sin campos innecesarios.',data.referees,r=>({sub:`${r.phone||'sin teléfono'}`,a:'Partidos',av:data.matches.filter(m=>m.referee===r.name).length,b:'Por recibir',bv:money(data.matches.filter(m=>m.referee===r.name).reduce((x,m)=>x+Math.max(0,m.refPay-m.toRef-m.paidRef),0)),note:`${r.accepts_promotions?'✓ Promociones':'No promociones'}${r.availability?' · '+r.availability:''}`}),'openRefereeModal()')}
function entityView(title,desc,list,map,addAction){return `<section class="intro"><div><span class="eyebrow">Base operativa</span><h2>${title}</h2><p>${desc}</p></div><button class="new" onclick="${addAction}">+ Agregar</button></section><div class="entity-grid">${list.map(e=>{const x=map(e);return `<article class="entity"><div class="entity-top"><div><h3>${esc(e.name)}</h3><p>${esc(x.sub)}</p></div><span class="status confirmed">Activo</span></div><div class="entity-stats"><div><small>${x.a}</small><strong>${x.av}</strong></div><div><small>${x.b}</small><strong>${x.bv}</strong></div></div>${x.note?`<p>${esc(x.note)}</p>`:''}</article>`}).join('')||'<div class="empty">Todavía no has agregado ninguno.</div>'}</div>`}
function observersView(){
  const rows=data.observers.map(o=>`<article class="entity"><div class="entity-top"><div><h3>${esc(o.name)}</h3><p>${esc(o.phone)||'sin teléfono'}</p></div><span class="status ${o.active?'confirmed':'cancelled'}">${o.active?'Activo':'Inactivo'}</span></div><div class="entity-stats"><div><small>Partidos asignados</small><strong>${data.matches.filter(m=>m.observer_id===o.id).length}</strong></div><div><small>Tarjetas pendientes</small><strong>${data.cardsPending.filter(c=>{const m=data.matches.find(x=>x.id===c.match_id);return m&&m.observer_id===o.id}).length}</strong></div></div></article>`).join('')||'<div class="empty">Todavía no has creado ningún veedor.</div>';
  const pending=data.cardsPending.map(c=>`<div class="mcard"><div class="who"><b>${esc(c.player_name)}</b><span class="meta">${c.team_side==='local'?'Local':'Visitante'} · ${c.card_type==='yellow'?'Tarjeta amarilla':'Tarjeta roja'}${c.matchName?' · '+esc(c.matchName):''}${c.matchDate?' · '+c.matchDate:''}</span></div><div class="money-mini"><b>${money(c.fee)}</b><small>por cobrar</small></div><button class="link-btn" onclick="markCardPaid('${c.id}')">Marcar pagada</button></div>`).join('')||'<div class="empty">No hay tarjetas pendientes de pago.</div>';
  return `<section class="intro"><div><span class="eyebrow">Acceso restringido</span><h2>Veedores</h2><p>Cada veedor solo ve, en su celular, los partidos que le asignas.</p></div><button class="new" onclick="openObserverModal()">+ Agregar veedor</button></section><div class="entity-grid">${rows}</div><div class="subhead">Novedades pendientes de pago</div><div class="match-list">${pending}</div>`;
}
async function markCardPaid(id){const {error}=await sb.from('cards').update({paid:true,paid_at:new Date().toISOString()}).eq('id',id);if(error){toastMsg('No se pudo marcar el pago.');return}toastMsg('Tarjeta marcada como pagada.');await loadAll();render()}
function financeView(){const rows=data.matches.map(m=>{const utility=m.service-m.refPay,debt=Math.max(0,m.refPay-m.toRef-m.paidRef),clientDebt=Math.max(0,m.service-m.toSilbatazo-m.toRef);return {...m,utility,debt,clientDebt}});return `<section class="intro"><div><span class="eyebrow">Dinero por partido</span><h2>Finanzas</h2><p>Quién recibió cuánto, qué falta y qué quedó.</p></div></section><section class="cards"><div class="metric"><small>Servicios</small><strong>${money(rows.reduce((a,m)=>a+m.service,0))}</strong></div><div class="metric" style="--accent:var(--yellow)"><small>Por cobrar</small><strong>${money(rows.reduce((a,m)=>a+m.clientDebt,0))}</strong></div><div class="metric" style="--accent:var(--red)"><small>Debemos árbitros</small><strong>${money(rows.reduce((a,m)=>a+m.debt,0))}</strong></div><div class="metric"><small>Utilidad</small><strong>${money(rows.reduce((a,m)=>a+m.utility,0))}</strong></div></section><div class="match-list">${rows.map(m=>`<div class="mcard"><div class="who"><b>${esc(m.name)}</b><span class="meta">${m.date} · servicio ${money(m.service)}</span></div><div class="money-mini"><b>${money(m.utility)}</b><small>utilidad</small></div><div class="money-mini"><b>${money(m.debt)}</b><small>debemos árbitro</small></div></div>`).join('')||'<div class="empty">No hay partidos registrados.</div>'}</div>`}
function render(){nav();pageTitle.textContent=navItems.find(x=>x[0]===current)[2];content.innerHTML=current==='home'?dashboard():current==='matches'?matchesView():current==='tournaments'?tournamentsView():current==='clients'?clientsView():current==='referees'?refereesView():current==='observers'?observersView():financeView();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{current=b.dataset.go;render()});if(current==='matches'){const filter=()=>{const q=matchSearch.value.toLowerCase(),s=statusFilter.value;matchTable.innerHTML=matchCards(data.matches.filter(m=>(!s||m.status===s)&&JSON.stringify(m).toLowerCase().includes(q)))};matchSearch.oninput=filter;statusFilter.onchange=filter}}

let advTouched=false;
function openModal(){
  modal.classList.add('open');advTouched=false;advPanel.hidden=true;advToggle.textContent='Ajustar quién le paga a quién ↓';
  document.getElementById('date').value=new Date().toISOString().slice(0,10);
  document.getElementById('client').innerHTML=data.clients.length?data.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''):'<option value="">Sin clientes — agrega uno primero</option>';
  document.getElementById('referee').innerHTML='<option value="">Sin asignar</option>'+data.referees.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');
  document.getElementById('tournament').innerHTML='<option value="">Partido independiente</option>'+data.tournaments.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  document.getElementById('observer').innerHTML='<option value="">Sin asignar</option>'+data.observers.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('');
  calcMoney();
}
function hideModal(){modal.classList.remove('open')}
newMatch.onclick=openModal;closeModalBtn.onclick=cancelModal.onclick=hideModal;modal.onclick=e=>{if(e.target===modal)hideModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')[modal,clientModal,refereeModal,tournamentModal,veedorModal].forEach(m=>m.classList.remove('open'))});
advToggle.onclick=()=>{advPanel.hidden=!advPanel.hidden;advToggle.textContent=advPanel.hidden?'Ajustar quién le paga a quién ↓':'Ocultar ajuste ↑'};
['toSilbatazo','toRef','paidRef'].forEach(id=>document.getElementById(id).addEventListener('input',()=>advTouched=true));
function calcMoney(){const s=+service.value||0,r=+refPay.value||0;if(!advTouched){const half=Math.round(s/2/1000)*1000;toSilbatazo.value=half;toRef.value=s-half}const si=+toSilbatazo.value||0,tr=+toRef.value||0,pr=+paidRef.value||0;profitCalc.textContent=money(s-r);debtCalc.textContent=money(Math.max(0,r-tr-pr));clientDebtCalc.textContent=money(Math.max(0,s-si-tr))}['service','refPay','toSilbatazo','toRef','paidRef'].forEach(id=>document.getElementById(id).addEventListener('input',calcMoney));

matchForm.onsubmit=async e=>{
  e.preventDefault();
  const f=Object.fromEntries(new FormData(matchForm));
  const saveBtn=matchForm.querySelector('.save');saveBtn.disabled=true;saveBtn.textContent='Guardando…';
  const payload={
    name:f.name,match_date:f.date,match_time:f.time,place:f.place,match_type:f.type,status:f.status,
    client_id:f.client||null,tournament_id:f.tournament||null,
    service_value:+f.service||0,officials_total:+f.refPay||0,
    client_to_silbatazo:+f.toSilbatazo||0,client_to_officials:+f.toRef||0,silbatazo_to_officials:+f.paidRef||0,
    notes:f.notes||null,created_by:currentUser.id,
  };
  const {data:inserted,error}=await sb.from('matches').insert(payload).select().single();
  if(error){toastMsg('No se pudo guardar el partido.');saveBtn.disabled=false;saveBtn.textContent='Guardar partido';return}
  const matchId=inserted.id;
  if(f.referee){await sb.from('match_officials').insert({match_id:matchId,referee_id:f.referee,role:'central',agreed_value:+f.refPay||0})}
  if(f.observer){await sb.from('match_observers').insert({match_id:matchId,observer_id:f.observer,agreed_value:+f.observerFee||0})}
  saveBtn.disabled=false;saveBtn.textContent='Guardar partido';
  hideModal();matchForm.reset();toastMsg('Partido guardado correctamente');current='matches';
  await loadAll();render();
};

function openClientModal(){clientModal.classList.add('open')}
function hideClientModal(){clientModal.classList.remove('open')}
closeClientModal.onclick=cancelClientModal.onclick=hideClientModal;clientModal.onclick=e=>{if(e.target===clientModal)hideClientModal()};
clientForm.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(clientForm));const btn=clientForm.querySelector('.save');btn.disabled=true;btn.textContent='Guardando…';const {error}=await sb.from('clients').insert({name:f.name,phone:f.phone||null,type:f.type});btn.disabled=false;btn.textContent='Guardar';if(error){toastMsg('No se pudo guardar el cliente.');return}hideClientModal();clientForm.reset();toastMsg('Cliente guardado.');await loadAll();render()};

function openRefereeModal(){refereeModal.classList.add('open')}
function hideRefereeModal(){refereeModal.classList.remove('open')}
closeRefereeModal.onclick=cancelRefereeModal.onclick=hideRefereeModal;refereeModal.onclick=e=>{if(e.target===refereeModal)hideRefereeModal()};
refereeForm.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(refereeForm));const btn=refereeForm.querySelector('.save');btn.disabled=true;btn.textContent='Guardando…';const {error}=await sb.from('referees').insert({name:f.name,phone:f.phone||null,availability:f.availability||null,accepts_promotions:!!f.promo});btn.disabled=false;btn.textContent='Guardar';if(error){toastMsg('No se pudo guardar el árbitro.');return}hideRefereeModal();refereeForm.reset();toastMsg('Árbitro guardado.');await loadAll();render()};

function openTournamentModal(){tournamentModal.classList.add('open')}
function hideTournamentModal(){tournamentModal.classList.remove('open')}
closeTournamentModal.onclick=cancelTournamentModal.onclick=hideTournamentModal;tournamentModal.onclick=e=>{if(e.target===tournamentModal)hideTournamentModal()};
tournamentForm.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(tournamentForm));const btn=tournamentForm.querySelector('.save');btn.disabled=true;btn.textContent='Guardando…';const {error}=await sb.from('tournaments').insert({name:f.name,notes:f.notes||null});btn.disabled=false;btn.textContent='Guardar';if(error){toastMsg('No se pudo guardar el torneo.');return}hideTournamentModal();tournamentForm.reset();toastMsg('Torneo guardado.');await loadAll();render()};

function openObserverModal(){veedorModal.classList.add('open');veedorForm.reset();veedorForm.hidden=false;veedorResult.hidden=true;veedorResult.innerHTML=''}
function hideVeedorModal(){veedorModal.classList.remove('open');render()}
closeVeedorModal.onclick=cancelVeedorModal.onclick=hideVeedorModal;veedorModal.onclick=e=>{if(e.target===veedorModal)hideVeedorModal()};
veedorForm.onsubmit=async e=>{
  e.preventDefault();
  const f=Object.fromEntries(new FormData(veedorForm));
  const btn=veedorForm.querySelector('.save');btn.disabled=true;btn.textContent='Creando…';
  try{
    const {data:{session}}=await sb.auth.getSession();
    const res=await fetch('/api/create-veedor',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({name:f.name,phone:f.phone,email:f.email})});
    const out=await res.json();
    btn.disabled=false;btn.textContent='Guardar';
    if(!out.ok){toastMsg(out.error||'No se pudo crear el veedor.');return}
    veedorForm.hidden=true;veedorResult.hidden=false;
    veedorResult.innerHTML=`<p>Veedor creado. Comparte estos datos por WhatsApp:</p><p><b>Correo:</b> ${esc(out.email)}<br><b>Contraseña:</b> ${esc(out.password)}</p><p style="color:#8b929b;font-size:.85rem">La puede cambiar más adelante; por ahora entra con esta en veedor.html.</p>`;
    await loadAll();
  }catch(err){btn.disabled=false;btn.textContent='Guardar';toastMsg('No se pudo crear el veedor.')}
};

logoutBtn.onclick=async()=>{await SilbatazoAuth.signOut();window.location.reload()};

(async function boot(){
  const session=await SilbatazoAuth.requireRole('admin',{title:'Panel administrativo',logoSrc:'assets/logos/silbato.png'});
  sb=session.client;currentUser=session.profile;
  userName.textContent=currentUser.full_name||'Administrador';
  userAvatar.textContent=(currentUser.full_name||'A').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  today.textContent=new Intl.DateTimeFormat('es-CO',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
  await loadAll();
  render();
})();
</script>
</body>
