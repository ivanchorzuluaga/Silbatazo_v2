<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06090f">
  <title>Silbatazo Gestión</title>
  <link rel="icon" type="image/png" href="assets/logos/silbato.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900&family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--black:#000;--ink:#06090f;--panel:#10151d;--panel2:#151c26;--gray:#8c8f95;--muted:#aeb4bf;--white:#f7f8fa;--brand:#00d08a;--yellow:#ffbe2c;--red:#ff615b;--line:rgba(140,143,149,.2);--display:"Barlow Condensed",Impact,sans-serif;--body:"Barlow",Arial,sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eef0f2;color:var(--ink);font-family:var(--body)}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}.app{min-height:100svh;display:grid;grid-template-columns:240px 1fr}.side{background:var(--ink);color:#fff;padding:24px 18px;position:sticky;top:0;height:100svh;display:flex;flex-direction:column;z-index:10}.side-logo{width:195px;max-width:100%;height:auto;margin:0 6px 28px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aeb4bf;text-align:left;padding:13px 14px;border-radius:9px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active{background:var(--brand);color:var(--ink)}.nav i{font-style:normal;width:20px;text-align:center}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:18px}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:var(--ink);font-weight:900}.side-foot small{color:var(--gray)}.public{display:block;margin-top:14px;color:var(--brand);font-size:.82rem;font-weight:800}.main{min-width:0}.topbar{height:76px;padding:0 clamp(18px,4vw,46px);display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #d9dce0;position:sticky;top:0;z-index:5}.topbar h1{font:900 clamp(1.7rem,4vw,2.2rem)/1 var(--display);text-transform:uppercase;margin:0}.today{color:#707782;font-size:.85rem}.new{border:0;border-radius:8px;padding:13px 18px;background:var(--brand);color:var(--ink);font-weight:900;text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}.content{padding:34px clamp(18px,4vw,46px) 90px;max-width:1500px}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:26px}.eyebrow{color:#008b5e;font-weight:900;text-transform:uppercase;letter-spacing:.11em;font-size:.76rem}.intro h2{margin:6px 0 4px;font:900 clamp(2.8rem,7vw,5rem)/.85 var(--display);text-transform:uppercase;letter-spacing:-.035em}.intro p{margin:0;color:#66707b}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}.metric{background:#fff;border:1px solid #dfe2e5;padding:20px;border-radius:12px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:4px;background:var(--accent,var(--brand))}.metric small{font-weight:800;color:#69727e;text-transform:uppercase}.metric strong{font:900 2.7rem/1 var(--display);display:block;margin-top:10px}.metric span{font-size:.8rem;color:#7c8490}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.75fr);gap:16px}.box{background:#fff;border:1px solid #dfe2e5;border-radius:12px;overflow:hidden}.box-head{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e7ea}.box-head h3{font:900 1.45rem/1 var(--display);text-transform:uppercase;margin:0}.box-head button{border:0;background:none;color:#007d56;font-weight:900;cursor:pointer}.match{padding:16px 20px;display:grid;grid-template-columns:82px 1fr auto;gap:14px;align-items:center;border-bottom:1px solid #eceef0}.match:last-child{border:0}.time{font:900 1.25rem/1 var(--display)}.time small{display:block;margin-top:5px;color:#8b929b;font:700 .7rem/1 var(--body);text-transform:uppercase}.match b{display:block;margin-bottom:5px}.meta{color:#737b86;font-size:.82rem}.status{padding:6px 9px;border-radius:100px;font-weight:900;font-size:.7rem;text-transform:uppercase;white-space:nowrap}.confirmed{background:#d7f8e8;color:#007148}.pending{background:#fff0bf;color:#825d00}.finished{background:#e4e8ee;color:#4d5662}.cancelled{background:#ffe0df;color:#a12520}.money{background:var(--ink);color:#fff}.money .box-head{border-color:var(--line)}.money-list{padding:14px 20px}.money-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.money-row:last-child{border:0}.money-row span{color:#b8bec7;font-size:.86rem}.money-row strong{color:var(--yellow)}.alert{margin:0 20px 20px;padding:14px;border:1px solid rgba(255,190,44,.4);background:rgba(255,190,44,.1);border-radius:8px;font-size:.82rem;line-height:1.45}.view{display:none}.view.active{display:block}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.search{flex:1;min-width:220px;border:1px solid #d5d9de;background:#fff;padding:12px 14px;border-radius:8px}.filter{border:1px solid #d5d9de;background:#fff;padding:12px;border-radius:8px}.table-wrap{background:#fff;border:1px solid #dfe2e5;border-radius:12px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:15px 17px;text-align:left;border-bottom:1px solid #eceef0}th{font-size:.72rem;text-transform:uppercase;color:#717a85;background:#f7f8f9}td{font-size:.9rem}tr:last-child td{border:0}.link-btn{border:0;background:none;color:#007d56;font-weight:900;cursor:pointer}.entity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.entity{background:#fff;border:1px solid #dfe2e5;border-radius:12px;padding:20px}.entity-top{display:flex;justify-content:space-between;gap:12px}.entity h3{margin:0 0 5px}.entity p{color:#737b86;font-size:.84rem}.entity-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}.entity-stats div{background:#f2f4f5;border-radius:8px;padding:10px}.entity-stats small{display:block;color:#737b86}.entity-stats strong{font:900 1.3rem var(--display)}.tournament{grid-column:span 1}.progress{height:7px;border-radius:10px;background:#e1e4e7;overflow:hidden;margin-top:15px}.progress i{display:block;height:100%;background:var(--brand)}.empty{padding:35px;text-align:center;color:#737b86}.mobile-nav{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:none;place-items:center;padding:18px}.modal.open{display:grid}.dialog{width:min(760px,100%);max-height:92svh;overflow:auto;background:#fff;border-radius:14px}.dialog-head{padding:20px 22px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0;font:900 2rem/1 var(--display);text-transform:uppercase}.close{border:0;background:none;color:#fff;font-size:1.8rem;cursor:pointer}.form{padding:22px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:.75rem;font-weight:900;text-transform:uppercase;color:#606a75}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd1d7;border-radius:8px;padding:11px;background:#fff}.financial{grid-column:1/-1;background:#f1f3f4;border-radius:10px;padding:16px}.financial h3{font:900 1.2rem var(--display);text-transform:uppercase;margin:0 0 12px}.calc{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.calc div{padding:10px;background:#fff;border-radius:7px}.calc small{display:block;color:#6d7680}.calc strong{font:900 1.3rem var(--display)}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.ghost{border:1px solid #ccd1d7;background:#fff;border-radius:8px;padding:12px 18px;font-weight:900;cursor:pointer}.save{border:0;background:var(--brand);border-radius:8px;padding:12px 20px;font-weight:900;cursor:pointer}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:14px 18px;border-left:5px solid var(--brand);border-radius:8px;z-index:50;transform:translateY(120px);transition:.25s}.toast.show{transform:none}
    @media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.entity-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:720px){.app{display:block}.side{display:none}.topbar{height:68px;padding:0 16px}.today{display:none}.new{padding:11px 13px;font-size:.75rem}.content{padding:24px 14px 95px}.intro h2{font-size:3.1rem}.cards{gap:8px}.metric{padding:15px}.metric strong{font-size:2.2rem}.match{grid-template-columns:68px 1fr}.match .status{grid-column:2}.entity-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full,.financial{grid-column:auto}.calc{grid-template-columns:1fr}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(6,1fr);left:0;right:0;bottom:0;height:70px;background:var(--ink);z-index:20}.mobile-nav button{border:0;background:none;color:#8f97a3;font-size:.62rem;font-weight:800;padding:8px 2px}.mobile-nav button.active{color:var(--brand)}.mobile-nav i{display:block;font-style:normal;font-size:1.15rem;margin-bottom:3px}.foot-hide{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side"><img class="side-logo" src="assets/logos/logo-completo.png" alt="Silbatazo"><nav class="nav" id="desktopNav"></nav><div class="side-foot"><div class="user"><span class="avatar">IZ</span><div><b>Administrador</b><small>Equipo Silbatazo</small></div></div><a class="public" href="silbatazo_landing_disruptiva.html">← Volver a la web pública</a></div></aside>
  <main class="main"><header class="topbar"><div><h1 id="pageTitle">Inicio</h1><span class="today" id="today"></span></div><button class="new" id="newMatch">+ Nuevo partido</button></header><div class="content" id="content"></div></main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h2>Nuevo partido</h2><button class="close" id="closeModal" aria-label="Cerrar">×</button></div><form class="form" id="matchForm"><div class="form-grid">
  <div class="field"><label for="date">Fecha</label><input id="date" name="date" type="date" required></div><div class="field"><label for="time">Hora</label><input id="time" name="time" type="time" required></div>
  <div class="field"><label for="client">Cliente</label><select id="client" name="client" required></select></div><div class="field"><label for="type">Tipo</label><select id="type" name="type"><option>Amistoso</option><option>Torneo</option><option>Promocional</option><option>Normal</option><option>Otro</option></select></div>
  <div class="field full"><label for="name">Partido / equipos</label><input id="name" name="name" placeholder="Ej. Los del Barrio vs Amigos FC" required></div><div class="field full"><label for="place">Lugar</label><input id="place" name="place" placeholder="Cancha y municipio" required></div>
  <div class="field"><label for="referee">Árbitro central</label><select id="referee" name="referee"></select></div><div class="field"><label for="status">Estado</label><select id="status" name="status"><option value="pending">Pendiente de árbitro</option><option value="confirmed">Confirmado</option><option value="finished">Finalizado</option><option value="cancelled">Cancelado</option></select></div>
  <div class="financial"><h3>Distribución del dinero</h3><div class="form-grid"><div class="field"><label for="service">Valor del servicio</label><input id="service" name="service" type="number" min="0" step="1000" value="80000"></div><div class="field"><label for="refPay">Pago total árbitros</label><input id="refPay" name="refPay" type="number" min="0" step="1000" value="70000"></div><div class="field"><label for="toSilbatazo">Cliente → Silbatazo</label><input id="toSilbatazo" name="toSilbatazo" type="number" min="0" step="1000" value="40000"></div><div class="field"><label for="toRef">Cliente → árbitros</label><input id="toRef" name="toRef" type="number" min="0" step="1000" value="40000"></div><div class="field"><label for="paidRef">Silbatazo → árbitros</label><input id="paidRef" name="paidRef" type="number" min="0" step="1000" value="0"></div></div><div class="calc"><div><small>Utilidad real</small><strong id="profitCalc">$10.000</strong></div><div><small>Debemos al árbitro</small><strong id="debtCalc">$30.000</strong></div><div><small>Cliente debe</small><strong id="clientDebtCalc">$0</strong></div></div></div>
  <div class="field full"><label for="notes">Observaciones</label><textarea id="notes" name="notes" rows="2"></textarea></div>
  </div><div class="actions"><button type="button" class="ghost" id="cancelModal">Cancelar</button><button class="save" type="submit">Guardar partido</button></div></form></div></div>
<div class="toast" id="toast">Partido guardado</div>
<script>
const navItems=[['home','⌂','Inicio'],['matches','◫','Partidos'],['tournaments','⚑','Torneos'],['clients','◎','Clientes'],['referees','◇','Árbitros'],['finance','$','Finanzas']];
const seed={clients:[{id:1,name:'Constructora Nova',phone:'300 555 0121',type:'Empresa'},{id:2,name:'Carlos Restrepo',phone:'315 440 8821',type:'Persona'},{id:3,name:'Torneo La Cantera',phone:'301 200 4500',type:'Torneo'}],referees:[{id:1,name:'Juan Pérez',phone:'300 411 2233',promo:true,since:'2024',available:'L–J después de 6pm'},{id:2,name:'Mateo Gómez',phone:'310 811 9076',promo:true,since:'2025',available:'Todos los días'},{id:3,name:'Andrés Ruiz',phone:'315 290 1144',promo:false,since:'2023',available:'Fines de semana'}],tournaments:[{id:1,name:'Torneo Empresarial Nova',teams:8,total:18,played:6},{id:2,name:'Copa La Cantera',teams:6,total:12,played:9}],matches:[{id:1,date:'2026-08-19',time:'18:00',name:'Los del Barrio vs Amigos FC',client:'Carlos Restrepo',place:'Cancha El Dorado · Itagüí',type:'Amistoso',referee:'Juan Pérez',status:'confirmed',service:80000,refPay:70000,toSilbatazo:40000,toRef:40000,paidRef:0},{id:2,date:'2026-08-19',time:'20:00',name:'Nova A vs Nova B',client:'Constructora Nova',place:'Unidad Deportiva · Envigado',type:'Torneo',referee:'Sin asignar',status:'pending',service:100000,refPay:90000,toSilbatazo:50000,toRef:0,paidRef:0},{id:3,date:'2026-08-20',time:'19:00',name:'Manchester vs Nacional',client:'Torneo La Cantera',place:'Cancha La 10 · Medellín',type:'Torneo',referee:'Mateo Gómez',status:'confirmed',service:85000,refPay:81000,toSilbatazo:42500,toRef:42500,paidRef:0},{id:4,date:'2026-08-21',time:'20:00',name:'Laureles FC vs Belén',client:'Carlos Restrepo',place:'Belén · Medellín',type:'Promocional',referee:'Andrés Ruiz',status:'confirmed',service:60000,refPay:58000,toSilbatazo:30000,toRef:30000,paidRef:0}]};
let data=JSON.parse(localStorage.getItem('silbatazo-gestion')||'null')||seed;let current='home';
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);const statusLabel={confirmed:'Confirmado',pending:'Pendiente',finished:'Finalizado',cancelled:'Cancelado'};const save=()=>localStorage.setItem('silbatazo-gestion',JSON.stringify(data));
function nav(){const html=navItems.map(([id,icon,label])=>`<button data-view="${id}" class="${current===id?'active':''}"><i>${icon}</i>${label}</button>`).join('');desktopNav.innerHTML=html;mobileNav.innerHTML=navItems.map(([id,icon,label])=>`<button data-view="${id}" class="${current===id?'active':''}"><i>${icon}</i>${label}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{current=b.dataset.view;render()})}
function matchRow(m){return `<div class="match"><div class="time">${m.time}<small>${m.date.slice(5).replace('-','/')}</small></div><div><b>${m.name}</b><span class="meta">📍 ${m.place} · ⚖ ${m.referee}</span></div><span class="status ${m.status}">${statusLabel[m.status]}</span></div>`}
function dashboard(){const matches=data.matches;const pending=matches.filter(m=>m.status==='pending').length;const total=matches.reduce((a,m)=>a+m.service,0);const refPay=matches.reduce((a,m)=>a+m.refPay,0);const paid=matches.reduce((a,m)=>a+m.toSilbatazo+m.toRef,0);return `<section class="intro"><div><span class="eyebrow">Control operativo</span><h2>Todo bajo control.</h2><p>Lo importante de Silbatazo, sin vueltas.</p></div></section><section class="cards"><div class="metric"><small>Partidos hoy</small><strong>${matches.filter(m=>m.date==='2026-08-19').length}</strong><span>Agenda del día</span></div><div class="metric" style="--accent:var(--yellow)"><small>Sin árbitro</small><strong>${pending}</strong><span>Requieren acción</span></div><div class="metric"><small>Esta semana</small><strong>${matches.length}</strong><span>${matches.filter(m=>m.status==='confirmed').length} confirmados</span></div><div class="metric" style="--accent:var(--yellow)"><small>Utilidad estimada</small><strong>${money(total-refPay)}</strong><span>Según partidos registrados</span></div></section><section class="grid"><div class="box"><div class="box-head"><h3>Próximos partidos</h3><button data-go="matches">Ver todos</button></div>${matches.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(matchRow).join('')}</div><div class="box money"><div class="box-head"><h3>Resumen financiero</h3></div><div class="money-list"><div class="money-row"><span>Servicios registrados</span><strong>${money(total)}</strong></div><div class="money-row"><span>Pagado por clientes</span><strong>${money(paid)}</strong></div><div class="money-row"><span>Pendiente por cobrar</span><strong>${money(total-paid)}</strong></div><div class="money-row"><span>Pago acordado árbitros</span><strong>${money(refPay)}</strong></div></div><p class="alert">La utilidad se calcula por partido. No se presupone un porcentaje fijo.</p></div></section>`}
function matchesView(){return `<section class="intro"><div><span class="eyebrow">Operación</span><h2>Partidos</h2><p>Agenda, asignaciones y dinero en un solo lugar.</p></div></section><div class="toolbar"><input class="search" id="matchSearch" placeholder="Buscar partido, cliente o árbitro…"><select class="filter" id="statusFilter"><option value="">Todos los estados</option><option value="pending">Pendiente</option><option value="confirmed">Confirmado</option><option value="finished">Finalizado</option><option value="cancelled">Cancelado</option></select></div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Partido</th><th>Cliente</th><th>Árbitro</th><th>Servicio</th><th>Utilidad</th><th>Estado</th></tr></thead><tbody id="matchTable">${tableRows(data.matches)}</tbody></table></div>`}
function tableRows(list){return list.map(m=>`<tr><td><b>${m.date}</b><br>${m.time}</td><td>${m.name}<br><small>${m.place}</small></td><td>${m.client}</td><td>${m.referee}</td><td>${money(m.service)}</td><td><b>${money(m.service-m.refPay)}</b></td><td><span class="status ${m.status}">${statusLabel[m.status]}</span></td></tr>`).join('')||`<tr><td colspan="7" class="empty">No encontramos partidos.</td></tr>`}
function tournamentsView(){return `<section class="intro"><div><span class="eyebrow">Grupos de partidos</span><h2>Torneos</h2><p>Cada partido conserva su precio, árbitros y pagos.</p></div><button class="new" onclick="toastMsg('Creación de torneos lista para conectar al backend')">+ Crear torneo</button></section><div class="entity-grid">${data.tournaments.map(t=>`<article class="entity tournament"><div class="entity-top"><div><h3>${t.name}</h3><p>${t.teams} equipos</p></div><span class="status confirmed">Activo</span></div><div class="entity-stats"><div><small>Partidos</small><strong>${t.total}</strong></div><div><small>Jugados</small><strong>${t.played}</strong></div></div><div class="progress"><i style="width:${t.played/t.total*100}%"></i></div><p><b>${t.total-t.played}</b> partidos pendientes</p><button class="link-btn">Ver jornadas →</button></article>`).join('')}</div>`}
function clientsView(){return entityView('Clientes','Historial, cartera y contacto.',data.clients,c=>({sub:`${c.type} · ${c.phone}`,a:'Partidos',av:data.matches.filter(m=>m.client===c.name).length,b:'Facturado',bv:money(data.matches.filter(m=>m.client===c.name).reduce((x,m)=>x+m.service,0))}))}
function refereesView(){return entityView('Árbitros','Asignaciones y pagos sin campos innecesarios.',data.referees,r=>({sub:`${r.phone} · Desde ${r.since}`,a:'Partidos',av:data.matches.filter(m=>m.referee===r.name).length,b:'Por recibir',bv:money(data.matches.filter(m=>m.referee===r.name).reduce((x,m)=>x+Math.max(0,m.refPay-m.toRef-m.paidRef),0)),note:`${r.promo?'✓ Promociones':'No promociones'} · ${r.available}`}))}
function entityView(title,desc,list,map){return `<section class="intro"><div><span class="eyebrow">Base operativa</span><h2>${title}</h2><p>${desc}</p></div><button class="new" onclick="toastMsg('Formulario listo para la siguiente conexión')">+ Agregar</button></section><div class="entity-grid">${list.map(e=>{const x=map(e);return `<article class="entity"><div class="entity-top"><div><h3>${e.name}</h3><p>${x.sub}</p></div><span class="status confirmed">Activo</span></div><div class="entity-stats"><div><small>${x.a}</small><strong>${x.av}</strong></div><div><small>${x.b}</small><strong>${x.bv}</strong></div></div>${x.note?`<p>${x.note}</p>`:''}<button class="link-btn">Ver historial →</button></article>`}).join('')}</div>`}
function financeView(){const rows=data.matches.map(m=>{const utility=m.service-m.refPay,debt=Math.max(0,m.refPay-m.toRef-m.paidRef),clientDebt=Math.max(0,m.service-m.toSilbatazo-m.toRef);return {...m,utility,debt,clientDebt}});return `<section class="intro"><div><span class="eyebrow">Dinero por partido</span><h2>Finanzas</h2><p>Quién recibió cuánto, qué falta y qué quedó.</p></div></section><section class="cards"><div class="metric"><small>Servicios</small><strong>${money(rows.reduce((a,m)=>a+m.service,0))}</strong></div><div class="metric" style="--accent:var(--yellow)"><small>Por cobrar</small><strong>${money(rows.reduce((a,m)=>a+m.clientDebt,0))}</strong></div><div class="metric" style="--accent:var(--red)"><small>Debemos árbitros</small><strong>${money(rows.reduce((a,m)=>a+m.debt,0))}</strong></div><div class="metric"><small>Utilidad</small><strong>${money(rows.reduce((a,m)=>a+m.utility,0))}</strong></div></section><div class="table-wrap"><table><thead><tr><th>Partido</th><th>Servicio</th><th>Cliente → Silbatazo</th><th>Cliente → árbitro</th><th>Debemos árbitro</th><th>Utilidad</th></tr></thead><tbody>${rows.map(m=>`<tr><td><b>${m.name}</b><br><small>${m.date}</small></td><td>${money(m.service)}</td><td>${money(m.toSilbatazo)}</td><td>${money(m.toRef)}</td><td><b>${money(m.debt)}</b></td><td><b>${money(m.utility)}</b></td></tr>`).join('')}</tbody></table></div>`}
function render(){nav();pageTitle.textContent=navItems.find(x=>x[0]===current)[2];content.innerHTML=current==='home'?dashboard():current==='matches'?matchesView():current==='tournaments'?tournamentsView():current==='clients'?clientsView():current==='referees'?refereesView():financeView();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{current=b.dataset.go;render()});if(current==='matches'){const filter=()=>{const q=matchSearch.value.toLowerCase(),s=statusFilter.value;matchTable.innerHTML=tableRows(data.matches.filter(m=>(!s||m.status===s)&&JSON.stringify(m).toLowerCase().includes(q)))};matchSearch.oninput=filter;statusFilter.onchange=filter}}
function openModal(){modal.classList.add('open');date.value=new Date().toISOString().slice(0,10);client.innerHTML=data.clients.map(c=>`<option>${c.name}</option>`).join('');referee.innerHTML='<option>Sin asignar</option>'+data.referees.map(r=>`<option>${r.name}</option>`).join('');calcMoney()};function closeModal(){modal.classList.remove('open')};newMatch.onclick=openModal;closeModal.onclick=cancelModal.onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};
function calcMoney(){const s=+service.value||0,r=+refPay.value||0,si=+toSilbatazo.value||0,tr=+toRef.value||0,pr=+paidRef.value||0;profitCalc.textContent=money(s-r);debtCalc.textContent=money(Math.max(0,r-tr-pr));clientDebtCalc.textContent=money(Math.max(0,s-si-tr))}['service','refPay','toSilbatazo','toRef','paidRef'].forEach(id=>document.getElementById(id).oninput=calcMoney);
matchForm.onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(matchForm));data.matches.push({id:Date.now(),...f,service:+f.service,refPay:+f.refPay,toSilbatazo:+f.toSilbatazo,toRef:+f.toRef,paidRef:+f.paidRef});save();closeModal();matchForm.reset();toastMsg('Partido guardado correctamente');current='matches';render()};function toastMsg(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)}
today.textContent=new Intl.DateTimeFormat('es-CO',{weekday:'long',day:'numeric',month:'long'}).format(new Date());render();
</script>
</body>
</html>
